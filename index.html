/* Layout: a Paris bistro – a gingham strip on top, one slate menu board as the hero,
   order tickets and recipe cards below; French in Andika, chalk in Caveat, UI in Fredoka. */
:root {
  --bg: #F3F5F8;          /* porcelain, slightly cool */
  --surface: #FFFFFF;
  --surface-2: #EEF1F6;
  --ink: #1C2333;         /* navy ink */
  --muted: #586276;
  --line: #D9DEE7;
  --bleu: #1F4FB5;        /* French blue – the accent */
  --bleu-ink: #FFFFFF;
  --bleu-soft: #E4ECFB;
  --rouge: #D3283E;       /* gingham red */
  --beurre: #E19A1E;      /* croissant butter */
  --beurre-soft: #FCEFD6;
  --ok: #17804F; --ok-soft: #E1F3E9;
  --bad: #C4283A; --bad-soft: #FBE4E7;
  --warn: #9A6410; --warn-soft: #FBEFD9;
  --m: #1F5FD1;           /* masculine nouns: blue (book tip) */
  --f: #D02A45;           /* feminine nouns: red */
  --slate: #24302C;       /* ardoise */
  --slate-2: #2D3A35;
  --chalk: #F2F0E6;
  --chalk-dim: #B8C3BC;
  --frame: #8A5A33;       /* wooden board frame */
  --vichy: rgba(211, 40, 62, .55);
  --shadow: 0 1px 2px rgba(28, 35, 51, .06), 0 6px 18px rgba(28, 35, 51, .07);
  --f-ui: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --f-body: "Andika", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-chalk: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141C; --surface: #18202C; --surface-2: #1F2836; --ink: #EDF1F7; --muted: #A4AEC0; --line: #2C3546;
    --bleu: #7DA3FF; --bleu-ink: #0D1424; --bleu-soft: #1C2A47; --rouge: #FF6C7E; --beurre: #F1B54A; --beurre-soft: #3A2D12;
    --ok: #4FCB8E; --ok-soft: #12352A; --bad: #FF7B88; --bad-soft: #3B1A22; --warn: #F1B54A; --warn-soft: #3A2D12;
    --m: #86AEFF; --f: #FF8597; --slate: #1B2622; --slate-2: #22302A; --chalk: #EEECE2; --chalk-dim: #A9B5AD; --frame: #6D4628;
    --vichy: rgba(255, 108, 126, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141C; --surface: #18202C; --surface-2: #1F2836; --ink: #EDF1F7; --muted: #A4AEC0; --line: #2C3546;
  --bleu: #7DA3FF; --bleu-ink: #0D1424; --bleu-soft: #1C2A47; --rouge: #FF6C7E; --beurre: #F1B54A; --beurre-soft: #3A2D12;
  --ok: #4FCB8E; --ok-soft: #12352A; --bad: #FF7B88; --bad-soft: #3B1A22; --warn: #F1B54A; --warn-soft: #3A2D12;
  --m: #86AEFF; --f: #FF8597; --slate: #1B2622; --slate-2: #22302A; --chalk: #EEECE2; --chalk-dim: #A9B5AD; --frame: #6D4628;
  --vichy: rgba(255, 108, 126, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-ui); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
.m { color: var(--m); font-weight: 700; }
.f { color: var(--f); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
[lang="fr"] { font-feature-settings: "kern"; }

/* gingham strip */
.vichy {
  height: 14px;
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, var(--vichy) 50%, transparent 50%),
    linear-gradient(0deg, var(--vichy) 50%, transparent 50%);
  background-size: 14px 14px;
}
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 48px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.35rem; letter-spacing: .2px; }
.brand .sub { font-size: .82rem; color: var(--muted); font-family: var(--f-ui); }
.purse { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.coin {
  font-family: var(--f-ui); font-weight: 600; font-size: .92rem; padding: 4px 10px; border-radius: 999px;
  background: var(--beurre-soft); color: var(--ink); border: 1px solid var(--line); white-space: nowrap;
}
.iconbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 40px; min-height: 40px;
  display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-ui); padding: 0 10px;
}

/* buttons */
.btn {
  font-family: var(--f-ui); font-weight: 600; font-size: 1rem; letter-spacing: .2px;
  border: 2px solid var(--bleu); background: var(--surface); color: var(--bleu);
  padding: 10px 18px; min-height: 46px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--bleu); color: var(--bleu-ink); }
.btn.warm { border-color: var(--beurre); background: var(--beurre); color: #1C1405; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .92rem; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: translateY(1px); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* hero: the menu board */
.hello { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; }
.hello .bubble {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; position: relative; box-shadow: var(--shadow);
}
.hello .bubble::before {
  content: ""; position: absolute; left: -9px; top: 26px; width: 16px; height: 16px; background: var(--surface);
  border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg);
}
.hello .bubble b { font-family: var(--f-ui); }
.mascot { width: 100%; height: auto; display: block; }
.board {
  background:
    radial-gradient(120% 80% at 20% 10%, rgba(255, 255, 255, .06), transparent 60%),
    radial-gradient(80% 60% at 90% 90%, rgba(255, 255, 255, .04), transparent 60%),
    var(--slate);
  color: var(--chalk); border: 10px solid var(--frame); border-radius: 14px; padding: 18px 16px 12px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25), var(--shadow);
}
.board h2 { font-family: var(--f-chalk); font-weight: 700; font-size: 2.3rem; text-align: center; letter-spacing: .5px; }
.board .boardsub { text-align: center; color: var(--chalk-dim); font-size: .9rem; margin-top: 2px; }
.menu { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.menu li + li { border-top: 1px dashed rgba(242, 240, 230, .25); }
.dish {
  width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 12px 4px;
  display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; border-radius: 8px;
}
.dish:hover { background: rgba(255, 255, 255, .04); }
.dish .no { font-family: var(--f-chalk); font-size: 1.15rem; color: var(--chalk-dim); text-align: center; line-height: 1; }
.dish .no b { display: block; font-size: 1.7rem; color: var(--chalk); }
.dish .name { font-family: var(--f-chalk); font-size: 1.75rem; font-weight: 700; line-height: 1.05; }
.dish .meta { font-size: .86rem; color: var(--chalk-dim); margin-top: 2px; }
.dish .prog { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; font-size: 1.05rem; line-height: 1; align-items: center; }
.dish .prog .ing { filter: grayscale(1) opacity(.35); }
.dish .prog .ing.on { filter: none; }
.dish .prog .dot { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--chalk-dim); margin-left: 3px; display: inline-block; }
.dish .prog .dot.w { background: rgba(242, 240, 230, .35); }
.dish .prog .dot.on { background: var(--chalk); border-color: var(--chalk); }
.dish .prog .dot.fx { background: var(--beurre); border-color: var(--beurre); }
.dish .dplate { font-size: 2rem; text-align: center; min-width: 54px; }
.dish .dplate .stars { display: block; font-size: .8rem; letter-spacing: 1px; color: var(--beurre); min-height: 1em; }
.coup {
  margin-top: 10px; border-top: 2px solid rgba(242, 240, 230, .35); padding-top: 10px;
}
.coup .dish .name { color: var(--beurre); }

/* tool tiles */
.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tool {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 10px; text-align: left;
  display: flex; flex-direction: column; gap: 4px; min-height: 92px; box-shadow: var(--shadow);
}
.tool .t { font-family: var(--f-ui); font-weight: 600; font-size: 1.02rem; }
.tool .d { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.tool .badge { align-self: flex-start; font-family: var(--f-ui); font-size: .78rem; background: var(--rouge); color: #fff; border-radius: 999px; padding: 0 8px; }
@media (max-width: 620px) { .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.note {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; font-size: .92rem;
}
.note.warnbox { background: var(--warn-soft); border-color: transparent; }
.note.infobox { background: var(--bleu-soft); border-color: transparent; }
.foot { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 20px; font-family: var(--f-ui); }

/* station header + recipe card */
.backrow { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.ticket {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px 4px var(--r) var(--r); box-shadow: var(--shadow);
  padding: 16px 16px 14px; position: relative;
}
.ticket::before {
  content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 8px;
  background: radial-gradient(circle at 7px -1px, var(--bg) 6px, transparent 6.5px) 0 0 / 14px 8px repeat-x;
}
.ticket .tno { font-family: var(--f-ui); font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
.ticket h2 { font-family: var(--f-chalk); font-size: 2.2rem; font-weight: 700; color: var(--ink); line-height: 1; margin-top: 4px; }
.ticket .story { margin-top: 6px; font-size: .95rem; }
.recipe { margin-top: 12px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)) 12px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: start; }
.recipe .gapcol { width: 12px; }
.slot {
  border: 2px dashed var(--line); background: var(--surface-2); border-radius: 12px; aspect-ratio: 1 / 1; max-width: 100%;
  display: flex; align-items: center; justify-content: center; font-size: 1.45rem; position: relative; padding: 0;
}
.slot .e { filter: grayscale(1) opacity(.3); transition: filter .4s; }
.slot.on { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.slot.on .e { filter: none; }
.slot.x { border-style: solid; border-color: var(--beurre); background: var(--beurre-soft); }
.slot.x .e { filter: none; }
.slot.cur { outline: 3px solid var(--bleu); outline-offset: 2px; }
.slot.step { border-radius: 6px; }
.slot.step.w { border-style: solid; border-color: var(--bleu); background: var(--bleu-soft); }
.slot.step.w .e, .slot.step.fx .e { filter: none; opacity: .75; }
.slot.step.fx { border-style: solid; border-color: var(--beurre); background: var(--beurre-soft); }
.slot .tick { position: absolute; right: -4px; bottom: -4px; background: var(--ok); color: #fff; font-size: .65rem; border-radius: 999px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--f-ui); }
.recipe-legend { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); margin-top: 4px; font-family: var(--f-ui); flex-wrap: wrap; }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

/* chalk rule box */
.ardoise {
  background: var(--slate); color: var(--chalk); border-radius: var(--r); padding: 12px 14px; border: 6px solid var(--frame);
}
.ardoise summary { font-family: var(--f-chalk); font-size: 1.55rem; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ardoise summary::-webkit-details-marker { display: none; }
.ardoise summary .tog { font-family: var(--f-ui); font-size: .8rem; color: var(--chalk-dim); font-weight: 500; }
.ardoise ul { margin: 8px 0 2px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.ardoise li { font-size: .95rem; }
.ardoise b { color: #FFFFFF; }
.ardoise .m { color: #9CC0FF; }
.ardoise .f { color: #FF9AA9; }
.ardoise s { color: var(--chalk-dim); }
.numgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 12px; font-size: .95rem; }
.numgrid span b { display: inline-block; min-width: 1.6em; color: var(--chalk-dim); font-weight: 400; }
.etre { border-collapse: collapse; font-size: .98rem; }
.etre td { padding: 2px 10px 2px 0; }
.etre td:nth-child(2) { font-weight: 700; color: #FFFFFF; }
.etre td:nth-child(3) { color: var(--chalk-dim); font-size: .88rem; }

/* task card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.reward { display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); font-size: .9rem; color: var(--muted); }
.reward .big { font-size: 1.7rem; line-height: 1; }
.reward b { color: var(--ink); font-weight: 600; }
.reward .code { margin-left: auto; font-family: var(--f-ui); font-weight: 600; font-size: .85rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; color: var(--ink); }
.q { font-size: 1.12rem; margin-top: 10px; }
.ctx { white-space: pre-line; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 1.02rem; }
.area { margin-top: 14px; }
.ans {
  width: 100%; font-size: 1.3rem; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  font-family: var(--f-body);
}
.ans:focus { border-color: var(--bleu); outline: none; }
.ans.okk { border-color: var(--ok); background: var(--ok-soft); }
.ans.nok { border-color: var(--bad); background: var(--bad-soft); }
.accents { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.accents button {
  min-width: 42px; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--f-body); font-size: 1.15rem; padding: 0 6px;
}
.accents button.shift { font-family: var(--f-ui); font-size: .85rem; }
.accents button.shift[aria-pressed="true"] { background: var(--bleu); color: var(--bleu-ink); border-color: var(--bleu); }
.sentence { font-size: 1.22rem; line-height: 2.3; }
.gapin {
  display: inline-block; width: 7.5em; max-width: 60vw; font-size: 1.15rem; padding: 2px 8px; border: 0; border-bottom: 3px solid var(--bleu);
  background: var(--bleu-soft); border-radius: 6px 6px 0 0; text-align: center; font-family: var(--f-body); color: var(--ink);
}
.gapin:focus { outline: none; background: var(--beurre-soft); }
.gapbtn {
  display: inline-flex; min-width: 4.2em; justify-content: center; font-size: 1.12rem; padding: 0 10px; border: 0; border-bottom: 3px solid var(--bleu);
  background: var(--bleu-soft); border-radius: 6px 6px 0 0; font-family: var(--f-body); line-height: 1.7; color: var(--ink);
}
.gapbtn.act { background: var(--beurre-soft); border-bottom-color: var(--beurre); }
.gapbtn.okk { background: var(--ok-soft); border-bottom-color: var(--ok); }
.gapbtn.nok { background: var(--bad-soft); border-bottom-color: var(--bad); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.opt {
  border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 48px; font-size: 1.08rem; text-align: left;
}
.opt.big { font-size: 1.3rem; }
.mcopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
@media (max-width: 520px) { .mcopts { grid-template-columns: 1fr; } }
.opt.sel { border-color: var(--bleu); background: var(--bleu-soft); }
.opt.okk { border-color: var(--ok); background: var(--ok-soft); }
.opt.nok { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.opt:disabled { cursor: default; }

/* tiles */
.line {
  min-height: 58px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface-2);
}
.line.okk { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.line.nok { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 48px; }
.tile {
  border: 2px solid var(--bleu); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 1.15rem; min-height: 44px;
}
.tile.used { visibility: hidden; }
.dline { display: block; width: 100%; text-align: left; font-size: 1.02rem; }
.line.dia { flex-direction: column; align-items: stretch; }
.pre { white-space: pre-line; }
.dline .nr { display: inline-block; min-width: 1.6em; font-family: var(--f-ui); font-weight: 600; color: var(--bleu); }

/* match + sort */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.match .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mitem {
  border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; min-height: 48px; text-align: left; font-size: 1.02rem; width: 100%;
}
.mitem.sel { border-color: var(--bleu); background: var(--bleu-soft); }
.mitem.done { border-color: var(--ok); background: var(--ok-soft); }
.mitem.shake { animation: shake .35s; border-color: var(--bad); }
.mitem[data-pair] { position: relative; padding-left: 30px; }
.mitem[data-pair]::before {
  content: attr(data-pair); position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: var(--f-ui); font-weight: 600; font-size: .8rem;
  background: var(--bleu); color: var(--bleu-ink); border-radius: 999px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
}
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; }
.chipbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 1.1rem; min-height: 44px; }
.chipbtn.sel { border-color: var(--bleu); background: var(--bleu-soft); }
.chipbtn.shake { animation: shake .35s; border-color: var(--bad); }
.boxes { display: grid; gap: 10px; margin-top: 12px; }
.box { border: 2px solid var(--line); border-radius: 14px; padding: 10px; min-height: 96px; background: var(--surface-2); text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.box .lab { font-family: var(--f-ui); font-weight: 700; font-size: 1.25rem; }
.box .in { display: flex; flex-wrap: wrap; gap: 6px; }
.box .in span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 1rem; }
.box.armed { border-color: var(--bleu); }
.box.mbox .lab { color: var(--m); }
.box.fbox .lab { color: var(--f); }

/* fix */
.toks { display: flex; flex-wrap: wrap; gap: 8px; font-size: 1.22rem; }
.tok { border: 2px solid transparent; border-bottom: 2px dotted var(--muted); background: none; border-radius: 8px; padding: 4px 8px; font-size: 1.22rem; }
.tok.sel { border-color: var(--beurre); background: var(--beurre-soft); }
.tok.nok { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.tok.okk { border-color: var(--ok); background: var(--ok-soft); }

/* feedback */
.fb { margin-top: 14px; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; }
.fb .who { width: 54px; }
.fb .title { font-family: var(--f-ui); font-weight: 600; font-size: 1.1rem; }
.fb.good { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.info { background: var(--bleu-soft); }
.fb .sol { margin-top: 4px; font-size: 1.05rem; }
.fb .sol b { font-family: var(--f-body); }
.fb .ex { margin-top: 4px; font-size: .95rem; color: var(--muted); }
.say { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; min-height: 30px; font-size: .9rem; margin-left: 6px; }

/* paper task */
.paper {
  background:
    repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px),
    var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 16px 44px; position: relative; box-shadow: var(--shadow);
}
.paper::before { content: ""; position: absolute; left: 30px; top: 0; bottom: 0; width: 2px; background: var(--rouge); opacity: .45; }

}

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });

/* ============================================================
   Bonjour Cuisine – task engine (screen tasks)
   modes: practice (2 tries, hints) · again (practice, result not
   overwritten) · test (1 try, no hints, no feedback)
   ============================================================ */
const PRAISE1 = ["Super!", "C'est cool!", "C'est bien!", "Super, Chef!"];
const PRAISE2 = ["D'accord!", "Bien!", "Ça va!"];
const OOPS = ["Attention!", "Pardon?"];
function one(a) { return a[rnd(a.length)]; }
const FR_SOL = { type: 1, gap: 1, pick: 1, order: 1, fix: 1, spell: 1 };

const ACC_LO = ["é", "è", "ê", "à", "â", "ç", "ô", "î", "ù", "û", "œ", "'"];
const ACC_UP = ["É", "È", "Ê", "À", "Â", "Ç", "Ô", "Î", "Ù", "Û", "Œ", "'"];
function insertAt(inp, ch) {
  if (!inp || inp.disabled) return;
  const s = inp.selectionStart != null ? inp.selectionStart : inp.value.length;
  const e = inp.selectionEnd != null ? inp.selectionEnd : inp.value.length;
  inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e);
  const p = s + ch.length;
  try { inp.focus({ preventScroll: true }); inp.setSelectionRange(p, p); } catch (er) { inp.focus(); }
  inp.dispatchEvent(new Event("input", { bubbles: true }));
}
function accentBar(getInput) {
  let up = false;
  const bar = h("div", { class: "accents", role: "group", "aria-label": "Akzente und Sonderzeichen" });
  const shift = h("button", { class: "shift", type: "button", "aria-pressed": "false", title: "Großbuchstaben" }, "⇧ Groß");
  const toggle = () => { up = !up; shift.setAttribute("aria-pressed", String(up)); draw(); };
  shift.addEventListener("mousedown", e => e.preventDefault());
  shift.addEventListener("touchstart", e => { e.preventDefault(); toggle(); }, { passive: false });
  shift.addEventListener("click", toggle);
  function draw() {
    clear(bar);
    (up ? ACC_UP : ACC_LO).forEach(ch => {
      const b = h("button", { type: "button", lang: "fr", "aria-label": "Zeichen " + ch }, ch);
      b.addEventListener("mousedown", e => e.preventDefault());
      b.addEventListener("touchstart", e => { e.preventDefault(); insertAt(getInput(), ch); }, { passive: false });
      b.addEventListener("click", () => insertAt(getInput(), ch));
      bar.appendChild(b);
    });
    bar.appendChild(shift);
  }
  draw();
  return bar;
}
let inpN = 0;
function textInput(cls, label) {
  return h("input", {
    class: cls, type: "text", lang: "fr", id: "in" + (++inpN), autocomplete: "off", autocorrect: "off", autocapitalize: "off",
    spellcheck: "false", enterkeyhint: "done", "aria-label": label || "Deine Antwort"
  });
}

/* mountTask(box, task, {mode, header, onDone(res, given, extra), onNext, nextLabel}) */
function mountTask(box, t, o) {
  const test = o.mode === "test";
  const card = h("div", { class: "card" });
  if (o.header) card.appendChild(o.header);
  card.appendChild(h("p", { class: "q" }, t.q));
  if (t.ctx) card.appendChild(h("div", { class: "ctx pre", lang: "fr" }, t.ctx));
  const area = h("div", { class: "area" });
  const fb = h("div", { "aria-live": "polite" });
  const ctr = h("div", { class: "btnrow area" });
  card.append(area, fb, ctr);
  box.appendChild(card);
  const st = { tries: 0, done: false, att: [] };

  function feedback(kind, title, msg, showSol, mood) {
    clear(fb);
    const wrap = h("div", { class: "fb " + kind });
    const who = h("div", { class: "who" }); who.innerHTML = mascotSVG(mood || (kind === "good" ? "wow" : kind === "bad" ? "oops" : "happy"), rankOf(euros()).idx);
    const body = h("div", null, h("div", { class: "title" }, title));
    if (msg) body.appendChild(h("div", null, msg));
    if (showSol) {
      const sol = solutionOf(t);
      body.appendChild(h("div", { class: "sol" }, "Lösung: ", h("b", { class: "pre", lang: "fr" }, sol), FR_SOL[t.t] ? sayBtn(sol) : null));
    }
    if (t.expl && (kind === "good" || showSol)) body.appendChild(h("div", { class: "ex" }, t.expl));
    wrap.append(who, body);
    fb.appendChild(wrap);
  }
  function nextBtn() {
    if (!o.onNext) return;
    clear(ctr);
    const b = h("button", { class: "btn primary", type: "button", onclick: () => o.onNext() }, o.nextLabel || "Weiter →");
    ctr.appendChild(b);
    setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* */ } }, 30);
  }
  const api = {
    test,
    done: () => st.done,
    ctr, fb,
    note(msg) { feedback("info", "Moment!", msg, false, "happy"); },
    /* result: {ok, near, tip, score, msg} – returns "ok" | "retry" | "x" | "saved" */
    resolve(result, given) {
      if (st.done) return null;
      if (test) {
        st.done = true;
        const score = result.score !== undefined ? result.score : (result.ok ? 1 : 0);
        o.onDone && o.onDone(score >= 1 ? "r1" : "x", given, { score });
        o.onNext && o.onNext();
        return "saved";
      }
      st.tries++;
      st.att.push(given);
      if (result.ok) {
        st.done = true;
        const res = st.tries === 1 ? "r1" : "r2";
        tone(SND.ok);
        feedback("good", res === "r1" ? one(PRAISE1) : one(PRAISE2), result.tip === "oe" ? "Richtig! Im Heft schreibst du o und e zusammen: œ." : null, st.tries > 1);
        o.onDone && o.onDone(res, given, { tries: st.att.slice() });
        nextBtn();
        return "ok";
      }
      tone(SND.bad);
      if (st.tries < 2) {
        feedback("bad", one(OOPS), result.msg || (result.near ? NEAR_TXT[result.near] : (t.hint || "Lies noch einmal genau und versuch es nochmal.")), false, "oops");
        return "retry";
      }
      st.done = true;
      feedback("bad", "Schade – so ist es richtig:", result.near ? NEAR_TXT[result.near] : null, true, "oops");
      o.onDone && o.onDone("x", given, { tries: st.att.slice() });
      nextBtn();
      return "x";
    },
    /* for match / sort in practice: result decided by error count */
    finishWith(res, given, title, msg) {
      if (st.done) return;
      st.done = true;
      if (res === "x") { tone(SND.bad); feedback("bad", title, msg, true, "oops"); }
      else { tone(SND.ok); feedback("good", title, msg, false, "wow"); }
      o.onDone && o.onDone(res, given, {});
      nextBtn();
    }
  };
  (RENDER[t.t] || RENDER.mc)(t, area, ctr, api);
  return api;
}

const RENDER = {};

/* ---- multiple choice / spelling choice ---- */
RENDER.mc = RENDER.spell = function (t, area, ctr, api) {
  const order = shuffle(t.opts.map((_, i) => i));
  const wrap = h("div", { class: t.t === "spell" ? "opts" : "mcopts" });
  let sel = null;
  const btn = {};
  order.forEach(i => {
    btn[i] = h("button", { class: "opt" + (t.t === "spell" ? " big" : ""), type: "button", lang: t.t === "spell" ? "fr" : null, onclick: () => choose(i) }, t.opts[i]);
    wrap.appendChild(btn[i]);
  });
  area.appendChild(wrap);
  let go = null;
  if (api.test) {
    go = h("button", { class: "btn primary", type: "button", disabled: true, onclick: () => api.resolve({ ok: sel === t.a }, sel === null ? "" : t.opts[sel]) }, "Weiter →");
    ctr.appendChild(go);
  }
  function lockAll() { Object.values(btn).forEach(b => { b.disabled = true; }); }
  function choose(i) {
    if (api.done()) return;
    if (api.test) { Object.values(btn).forEach(b => b.classList.remove("sel")); btn[i].classList.add("sel"); sel = i; go.disabled = false; return; }
    const r = api.resolve({ ok: i === t.a }, t.opts[i]);
    if (r === "ok") { btn[i].classList.add("okk"); lockAll(); }
    else if (r === "retry") { btn[i].classList.add("nok"); btn[i].disabled = true; }
    else if (r === "x") { btn[i].classList.add("nok"); btn[t.a].classList.add("okk"); lockAll(); }
  }
};

/* ---- typed answer ---- */
RENDER.type = function (t, area, ctr, api) {
  const inp = textInput("ans");
  area.append(inp, accentBar(() => inp));
  const go = h("button", { class: "btn primary", type: "button", onclick: check }, api.test ? "Weiter →" : "Prüfen");
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  inp.addEventListener("input", () => inp.classList.remove("nok"));
  ctr.appendChild(go);
  function check() {
    if (api.done()) return;
    const val = inp.value;
    if (!api.test && !cmpKey(val)) { api.note(NEAR_TXT.empty); return; }
    const r = api.resolve(judge(val, t.acc), val);
    if (r === "ok") { inp.classList.add("okk"); inp.disabled = true; }
    else if (r === "retry") { inp.classList.add("nok"); }
    else if (r === "x") { inp.classList.add("nok"); inp.disabled = true; }
  }
};

/* ---- sentence with typed gaps ---- */
RENDER.gap = function (t, area, ctr, api) {
  const sent = h("div", { class: "sentence", lang: "fr" });
  const inputs = [];
  t.s.split(/(\{\d+\})/).forEach(p => {
    const m = p.match(/^\{(\d+)\}$/);
    if (m) { const i = textInput("gapin", "Lücke " + (+m[1] + 1)); inputs[+m[1]] = i; sent.appendChild(i); }
    else if (p) sent.appendChild(document.createTextNode(p));
  });
  let last = inputs[0];
  inputs.forEach((i, k) => {
    i.addEventListener("focus", () => { last = i; });
    i.addEventListener("input", () => i.classList.remove("nok"));
    i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (k < inputs.length - 1) inputs[k + 1].focus(); else check(); } });
  });
  area.append(sent, accentBar(() => last));
  const go = h("button", { class: "btn primary", type: "button", onclick: check }, api.test ? "Weiter →" : "Prüfen");
  ctr.appendChild(go);
  function check() {
    if (api.done()) return;
    const vals = inputs.map(i => i.value);
    if (!api.test && vals.some(v => !cmpKey(v))) { api.note("Füll zuerst alle Lücken aus."); return; }
    const js = inputs.map((inp, k) => judge(inp.value, t.acc[k]));
    const ok = js.every(j => j.ok);
    const nearJ = js.find(j => !j.ok && j.near);
    const score = js.filter(j => j.ok).length / js.length;
    const r = api.resolve({ ok, near: nearJ ? nearJ.near : null, tip: js.some(j => j.tip === "oe") ? "oe" : null, score }, vals);
    if (r === "saved") return;
    js.forEach((j, k) => { inputs[k].classList.toggle("okk", j.ok); inputs[k].classList.toggle("nok", !j.ok); });
    if (r === "ok" || r === "x") inputs.forEach(i => { i.disabled = true; });
  }
};

/* ---- sentence with choice gaps ---- */
RENDER.pick = function (t, area, ctr, api) {
  const sent = h("div", { class: "sentence", lang: "fr" });
  const btns = []; const startAt = []; const vals = []; const spAfter = [];
  let act = 0;
  const parts = t.s.split(/(\{\d+\})/);
  let sofar = "", lastGap = null;
  parts.forEach(p => {
    const m = p.match(/^\{(\d+)\}$/);
    if (m) {
      const k = +m[1];
      startAt[k] = sofar.trim() === "" || /[.!?]$/.test(sofar.trim());
      btns[k] = h("button", { class: "gapbtn", type: "button", "aria-label": "Lücke " + (k + 1), onclick: () => activate(k) }, "…");
      sent.appendChild(btns[k]);
      sofar += "X"; lastGap = k;
    } else if (p) {
      if (lastGap !== null && p.charAt(0) === " ") { spAfter[lastGap] = h("span", null, " "); sent.appendChild(spAfter[lastGap]); p = p.slice(1); }
      if (p) sent.appendChild(document.createTextNode(p));
      sofar += " " + p; lastGap = null;
    }
  });
  function showVal(k, v) { btns[k].textContent = startAt[k] ? cap(v) : v; if (spAfter[k]) spAfter[k].hidden = /'$/.test(v); }
  const row = h("div", { class: "opts", role: "group", "aria-label": "Auswahl" });
  t.opts.forEach(op => row.appendChild(h("button", { class: "opt", type: "button", lang: "fr", onclick: () => set(op) }, op)));
  area.append(sent, h("p", { class: "small muted" }, "Tipp eine Lücke an und wähle unten:"), row);
  const go = h("button", { class: "btn primary", type: "button", disabled: true, onclick: check }, api.test ? "Weiter →" : "Prüfen");
  ctr.appendChild(go);
  activate(0);
  function activate(k) { if (api.done()) return; act = k; btns.forEach((b, i) => b.classList.toggle("act", i === k)); }
  function set(op) {
    if (api.done()) return;
    vals[act] = op;
    showVal(act, op);
    btns[act].classList.remove("nok", "okk");
    const nxt = btns.findIndex((b, i) => !vals[i]);
    if (nxt >= 0) activate(nxt); else activate(act);
    go.disabled = btns.some((b, i) => !vals[i]);
  }
  function check() {
    if (api.done()) return;
    const okArr = btns.map((b, i) => vals[i] === t.a[i]);
    const ok = okArr.every(Boolean);
    const r = api.resolve({ ok, score: okArr.filter(Boolean).length / okArr.length }, vals.slice());
    if (r === "saved") return;
    okArr.forEach((good, i) => { btns[i].classList.toggle("okk", good); btns[i].classList.toggle("nok", !good); });
    if (r === "x") okArr.forEach((good, i) => { if (!good) { showVal(i, t.a[i]); btns[i].classList.remove("nok"); btns[i].classList.add("okk"); } });
    if (r === "ok" || r === "x") { btns.forEach(b => { b.disabled = true; }); row.querySelectorAll("button").forEach(b => { b.disabled = true; }); }
  }
};

/* ---- word order / dialogue order ---- */
RENDER.order = RENDER.dialog = function (t, area, ctr, api) {
  const isDia = t.t === "dialog";
  const items = isDia ? t.lines : t.tiles;
  const line = h("div", { class: "line" + (isDia ? " dia" : ""), lang: "fr", "aria-label": isDia ? "Dein Dialog" : "Dein Satz" });
  const pool = h("div", { class: "pool", lang: "fr" });
  const order = shuffledNot(items.map((_, i) => i));
  let placed = [];
  const pb = {};
  order.forEach(i => {
    pb[i] = h("button", { class: "tile" + (isDia ? " dline" : ""), type: "button", onclick: () => place(i) }, items[i]);
    pool.appendChild(pb[i]);
  });
  const go = h("button", { class: "btn primary", type: "button", disabled: true, onclick: check }, api.test ? "Weiter →" : "Prüfen");
  const reset = h("button", { class: "btn ghost small", type: "button", onclick: () => { if (api.done()) return; placed = []; Object.values(pb).forEach(b => b.classList.remove("used")); draw(); } }, "↺ Neu");
  ctr.append(go, reset);
  area.append(h("p", { class: "small muted" }, isDia ? "Tipp die Zeilen in der richtigen Reihenfolge an:" : "Tipp die Wörter in der richtigen Reihenfolge an:"), line, pool);
  draw();
  function place(i) { if (api.done() || placed.includes(i)) return; placed.push(i); pb[i].classList.add("used"); tone(SND.tap); draw(); }
  function unplace(i) { if (api.done()) return; placed = placed.filter(x => x !== i); pb[i].classList.remove("used"); draw(); }
  function draw() {
    clear(line);
    line.classList.remove("nok", "okk");
    if (!placed.length) line.appendChild(h("span", { class: "small muted" }, "…"));
    placed.forEach((i, n) => line.appendChild(h("button", { class: "tile" + (isDia ? " dline" : ""), type: "button", onclick: () => unplace(i) }, isDia ? h("span", { class: "nr" }, (n + 1) + ".") : null, items[i])));
    go.disabled = placed.length !== items.length;
  }
  function check() {
    if (api.done()) return;
    const given = placed.map(i => items[i]);
    const ok = isDia ? given.every((g, n) => g === t.lines[n]) : (cmpKey(given.join(" ")) === cmpKey(t.tiles.join(" ")) || (t.alt || []).some(a => cmpKey(a) === cmpKey(given.join(" "))));
    const score = ok ? 1 : (isDia ? given.filter((g, n) => g === t.lines[n]).length / t.lines.length : 0);
    const r = api.resolve({ ok, score }, isDia ? given.map(g => t.lines.indexOf(g) + 1).join("-") : given.join(" "));
    if (r === "saved") return;
    line.classList.toggle("okk", r === "ok");
    line.classList.toggle("nok", r !== "ok");
    if (r === "ok" || r === "x") { reset.disabled = true; line.querySelectorAll("button").forEach(b => { b.disabled = true; }); pool.querySelectorAll("button").forEach(b => { b.disabled = true; }); }
  }
};

/* ---- matching pairs ---- */
RENDER.match = function (t, area, ctr, api) {
  const n = t.pairs.length;
  const L = t.pairs.map((_, i) => i);
  const R = shuffledNot(L);
  const grid = h("div", { class: "match" });
  const colL = h("div", { class: "col" }), colR = h("div", { class: "col" });
  grid.append(colL, colR);
  const lb = {}, rb = {};
  let selL = null, selR = null, errors = 0, doneN = 0, label = 0;
  const pairOf = {}; // test: left -> right
  L.forEach(i => { lb[i] = h("button", { class: "mitem", type: "button", onclick: () => tapL(i) }, t.pairs[i][0]); colL.appendChild(lb[i]); });
  R.forEach(i => { rb[i] = h("button", { class: "mitem", type: "button", onclick: () => tapR(i) }, t.pairs[i][1]); colR.appendChild(rb[i]); });
  area.append(h("p", { class: "small muted" }, "Tipp links ein Feld an und dann rechts das passende."), grid);
  let go = null;
  if (api.test) { go = h("button", { class: "btn primary", type: "button", disabled: true, onclick: submitTest }, "Weiter →"); ctr.appendChild(go); }
  function mark() {
    Object.entries(lb).forEach(([i, b]) => b.classList.toggle("sel", +i === selL));
    Object.entries(rb).forEach(([i, b]) => b.classList.toggle("sel", +i === selR));
  }
  function tapL(i) {
    if (api.done()) return;
    if (api.test && pairOf[i] !== undefined) { unpair(i); if (selR === null) { selL = null; mark(); return; } }
    if (!api.test && lb[i].classList.contains("done")) return;
    selL = i; mark(); tryPair();
  }
  function tapR(i) {
    if (api.done()) return;
    if (api.test) { const l = Object.keys(pairOf).find(k => pairOf[k] === i); if (l !== undefined) { unpair(+l); if (selL === null) { selR = null; mark(); return; } } }
    if (!api.test && rb[i].classList.contains("done")) return;
    selR = i; mark(); tryPair();
  }
  function unpair(l) {
    const r = pairOf[l]; delete pairOf[l];
    lb[l].removeAttribute("data-pair"); rb[r].removeAttribute("data-pair");
    go.disabled = Object.keys(pairOf).length !== n;
  }
  function tryPair() {
    if (selL === null || selR === null) return;
    const l = selL, r = selR; selL = selR = null;
    if (api.test) {
      label++;
      pairOf[l] = r;
      const used = new Set(Object.keys(pairOf).map(k => lb[k].getAttribute("data-pair")));
      let lab = 1; while (used.has(String(lab))) lab++;
      lb[l].setAttribute("data-pair", lab); rb[r].setAttribute("data-pair", lab);
      mark(); tone(SND.tap);
      go.disabled = Object.keys(pairOf).length !== n;
      return;
    }
    if (l === r) {
      doneN++; label++;
      [lb[l], rb[r]].forEach(b => { b.classList.add("done"); b.classList.remove("sel"); b.setAttribute("data-pair", label); b.disabled = true; });
      tone(SND.tap);
      if (doneN === n) {
        const res = errors === 0 ? "r1" : errors <= 2 ? "r2" : "x";
        api.finishWith(res, { errors }, res === "r1" ? one(PRAISE1) + " Alles richtig verbunden." : res === "r2" ? "D'accord! Fertig – mit " + errors + (errors === 1 ? " Fehlversuch." : " Fehlversuchen.") : "Fertig – aber " + errors + " Fehlversuche. Das üben wir in der Fehler-Kiste.");
      }
    } else {
      errors++; tone(SND.bad);
      [lb[l], rb[r]].forEach(b => { b.classList.remove("sel"); b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); });
    }
    mark();
  }
  function submitTest() {
    const right = L.filter(i => pairOf[i] === i).length;
    api.resolve({ ok: right === n, score: right / n }, L.map(i => t.pairs[i][0] + " = " + (pairOf[i] === undefined ? "?" : t.pairs[pairOf[i]][1])));
  }
};

/* ---- sort into boxes ---- */
RENDER.sort = function (t, area, ctr, api) {
  const order = shuffle(t.items.map((_, i) => i));
  const chips = h("div", { class: "chips", lang: "fr" });
  const boxesEl = h("div", { class: "boxes", style: { gridTemplateColumns: "repeat(" + t.boxes.length + ", minmax(0, 1fr))" } });
  const cb = {}; const boxIn = {}; const boxBtn = {};
  let sel = null, errors = 0, placedN = 0;
  const where = {}; // test: item -> box
  order.forEach(i => { cb[i] = h("button", { class: "chipbtn", type: "button", onclick: () => tapChip(i) }, t.items[i][0]); chips.appendChild(cb[i]); });
  t.boxes.forEach(b => {
    const gender = (b === "un" || b === "le") ? " mbox" : (b === "une" || b === "la") ? " fbox" : "";
    boxIn[b] = h("div", { class: "in", lang: "fr" });
    boxBtn[b] = h("div", { class: "box" + gender, role: "button", tabindex: "0", onclick: () => tapBox(b), "aria-label": "Kiste " + b }, h("span", { class: "lab", lang: "fr" }, b), boxIn[b]);
    boxBtn[b].addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapBox(b); } });
    boxesEl.appendChild(boxBtn[b]);
  });
  area.append(h("p", { class: "small muted" }, "Tipp ein Wort an und dann die passende Kiste."), chips, boxesEl);
  let go = null;
  if (api.test) { go = h("button", { class: "btn primary", type: "button", disabled: true, onclick: submitTest }, "Weiter →"); ctr.appendChild(go); }
  function tapChip(i) {
    if (api.done()) return;
    sel = i; Object.entries(cb).forEach(([k, b]) => b.classList.toggle("sel", +k === i));
    Object.values(boxBtn).forEach(b => b.classList.add("armed"));
  }
  function tapBox(b) {
    if (api.done() || sel === null) return;
    const i = sel; sel = null;
    Object.values(boxBtn).forEach(x => x.classList.remove("armed"));
    cb[i].classList.remove("sel");
    if (api.test) {

RENDER.fix = function (t, area, ctr, api) {

/* ---------- report ---------- */
function screenMistakes() {
  const out = [];
  STATIONS.forEach(st => st.screen.forEach(t => {
    const r = S.scr[t.id];
    if (r && r.r === "x") {
      const tries = S.log.filter(l => l.id === t.id && l.mode === "practice").map(l => l.tries ? l.tries.map(givenText).join(" → ") : givenText(l.given));
      out.push({ id: t.id, st: st.n, q: t.q, sol: solutionOf(t).replace(/\n/g, " / "), fixed: !!S.fixed[t.id], given: tries });
    }
  }));
  return out;
}
function reportText() {
  const L = [];
  const e = euros(), rk = rankOf(e);
  const today = S.time.days[dayKey()] || 0;
  const days = Object.keys(S.time.days).length;
  let ans = 0, r1 = 0, r2 = 0, x = 0, fx = 0;
  STATIONS.forEach(st => st.screen.forEach(t => { const r = S.scr[t.id]; if (r) { ans++; if (r.r === "r1") r1++; else if (r.r === "r2") r2++; else { x++; if (S.fixed[t.id]) fx++; } } }));
  const pc = { ok: 0, okfix: 0, written: 0, refix: 0, fix: 0, none: 0 };
  STATIONS.forEach(st => st.paper.forEach(t => { pc[papStatus(t.id)]++; }));
  const served = STATIONS.filter(st => dishInfo(st).served).length;
  L.push("BONJOUR CUISINE – French practice for KA N°1 (Wednesday 7 Oct 2026)");
  L.push((KID ? "Name: " + KID + " · " : "Class edition · ") + "Report created " + new Date().toLocaleString("en-GB") + " · App " + APP.version);
  L.push("");
  L.push("OVERVIEW");
  L.push("Practice time: " + fmtDurEn(S.time.ms) + " on " + days + " day(s) · today " + fmtDurEn(today));
  L.push("Dishes finished: " + served + "/6 · stars " + starsTotal() + "/18 · tips " + e + " € (rank: " + rk.name + ")");
  L.push("Screen tasks: " + ans + "/36 answered · " + r1 + " right first time · " + r2 + " after a hint · " + x + " wrong (" + fx + " fixed later)");
  L.push("Paper tasks (stations): " + (pc.ok + pc.okfix) + "/24 correct (" + pc.okfix + " after fixing) · " + (pc.written + pc.refix) + " waiting for your check · " + pc.fix + " sent back · " + pc.none + " not written");
  if (S.pinResets && S.pinResets.length) L.push("PIN reset on: " + S.pinResets.map(t => new Date(t).toLocaleString("en-GB")).join(", "));
  L.push("");
  L.push("STATIONS");
  STATIONS.forEach(st => {
    const d = dishInfo(st);
    const w = d.scr.filter(r => r === "x").length, two = d.scr.filter(r => r === "r2").length;
    L.push(st.n + " " + st.title + " – " + st.dish.fr + ": screen " + d.screenDone + "/6 (" + d.r1 + " first try, " + two + " after hint, " + w + " wrong) · paper " + d.paperDone + "/4 checked (" + d.paperOk + " without fixing) · " + (d.served ? "finished " + "★".repeat(d.stars) + "☆".repeat(3 - d.stars) : "not finished"));
  });
  const sm = screenMistakes();
  L.push("");
  L.push("SCREEN MISTAKES (wrong after two tries)");
  if (!sm.length) L.push("None.");
  sm.forEach(m => {
    L.push("- " + m.id + " (station " + m.st + ")" + (m.fixed ? " – fixed later in the Fehler-Kiste" : " – still open") + ": " + m.q);
    L.push("  Answer: " + m.sol + (PERSONAL && m.given.length ? " · " + (KID || "Child") + " gave: " + m.given.join(" | ") : ""));
  });
  L.push("");
  L.push("PAPER – WAITING OR SENT BACK");
  const open = Object.keys(S.pap).filter(id => ["written", "refix", "fix"].includes(S.pap[id].s));
  if (!open.length) L.push("Nothing open.");
  open.forEach(id => { const m = paperMeta(id); const p = S.pap[id]; L.push("- " + (m ? m.code : id) + ": " + STATUS_EN[p.s] + (p.note ? " – note: " + p.note : "")); });
  L.push("");
  L.push("PRACTICE KA (Le coup de feu)");
  const runs = S.tests.filter(r => r.done);
  if (!runs.length) L.push("Not done yet." + (S.tests.some(r => !r.done) ? " One run is in progress." : ""));
  runs.forEach(r => {
    const sc = testScore(r);
    const parts = TEST_PARTS.map(pt => { const p = sc.parts[pt.key]; const l = lightOf(p.got, p.max, p.open); return pt.en.split(" · ")[1] + " " + ({ g: "green", y: "yellow", r: "red", n: "open" })[l] + " (" + half(p.got) + "/" + p.max + (p.open ? ", " + p.open + " unchecked" : "") + ")"; }).join(" · ");
    L.push("Run " + r.n + " – " + new Date(r.end || r.start).toLocaleString("en-GB") + ": screen " + sc.s + "/" + sc.sMax + " · paper " + (sc.pOpen ? sc.p + " so far, " + sc.pOpen + " unchecked" : sc.p + "/" + sc.pMax));
    L.push("  " + parts);
    const wrong = r.items.filter(it => it.k === "s" && (!r.ans[it.id] || r.ans[it.id].score < 1));
    if (wrong.length) L.push("  Not fully right: " + wrong.map(it => { const t = TASKS[it.id].task; const a = r.ans[it.id]; return it.id + " [" + solutionOf(t).replace(/\n/g, " / ") + "]" + (PERSONAL && a && a.given !== undefined ? " gave: " + givenText(a.given) : ""); }).join("; "));
  });
  L.push("");
  L.push("MARCHÉ (vocabulary game)");
  const mr = S.mk.runs; const right = mr.reduce((a, r) => a + (r.right || 0), 0);
  L.push("Rounds: " + mr.length + " · clues right " + right + "/" + (mr.length * 6) + " · pastries " + Object.keys(S.mk.pastries).length + "/" + PASTRIES.length);
  const missed = Object.entries(S.mk.words).filter(([k, w]) => w.bad > 0).sort((a, b) => b[1].bad - a[1].bad).slice(0, 12);
  if (missed.length) L.push("Most missed: " + missed.map(([k, w]) => wkLabel(k) + " (" + w.bad + "× wrong, " + w.ok + "× right)").join("; "));
  return L.join("\n");
}
function wkLabel(k) {
  if (k.startsWith("num:")) { const n = +k.slice(4); return n + " = " + NUMBERS[n]; }
  if (k.startsWith("etre:")) { const p = k.slice(5); return p + " " + ETRE.find(x => x[0] === p)[1]; }
  if (k.startsWith("art:")) return k.slice(4) + " (article)";
  return k;
}
function copyText(txt, okMsg) {
